spring.application.name=velosight-backend
server.port=8080

# Database Configuration (Default embedded H2 with PostgreSQL Mode for instant local execution)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:velosight_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Allow H2 Console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart File Upload Limits (Up to 500MB video uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Custom VeloSight Properties
velosight.upload-dir=uploads
velosight.processed-dir=processed
velosight.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
velosight.jwt.secret=${JWT_SECRET:VeloSightSuperSecretKeyForJWTAuthTokenGeneration2026SecureKey!}
velosight.jwt.expiration=86400000
