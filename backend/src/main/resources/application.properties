spring.application.name=velosight-backend
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/velosight_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:adarsh@1234}

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# Multipart File Upload Limits (Up to 500MB video uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Custom VeloSight Properties
velosight.upload-dir=uploads
velosight.processed-dir=processed
velosight.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
velosight.jwt.secret=${JWT_SECRET:VeloSightSuperSecretKeyForJWTAuthTokenGeneration2026SecureKey!}
velosight.jwt.expiration=86400000
