version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: velosight-db
    environment:
      POSTGRES_DB: velosight_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velosight-backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/velosight_db
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgrespassword
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: velosight-ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: velosight-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
